name: Deploy alerts
on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'alerts.yaml'
      - '.nais/alerterator.yaml'
  workflow_dispatch:
jobs:
  apply-alerts-dev:
    name: Apply alerts to cluster dev-gcp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: deploy to dev
        uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: dev-gcp
          RESOURCE: .nais/alerterator.yaml
  apply-alerts-prod:
    name: Apply alerts to cluster prod-gcp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: deploy to prod
        uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: prod-gcp
          RESOURCE: .nais/alerterator.yaml
